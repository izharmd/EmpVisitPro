[versions]
# Core versions
constraintlayout-compose = "1.1.1"
kotlin = "2.2.21"
agp = "8.13.0"

# Jetpack Compose
compose-bom = "2025.10.01"
accompanist-systemuicontroller = "0.36.0"

# Hilt + KSP
hilt = "2.57.2"
ksp = "2.2.21-2.0.4"

# AndroidX + Room
room = "2.8.3"
lifecycle = "2.9.4"
navigation = "2.8.3"

# Coroutines
coroutines = "1.10.2"

# Ktor http client
ktor-client-android = "3.3.1"
ktor-client-cio = "3.3.1"
ktor-client-content-negotiation = "3.3.1"
ktor-client-core = "3.3.1"
ktor-client-gson = "3.3.1"
ktor-client-json = "3.3.1"
ktor-client-logging = "3.3.1"
ktor-client-logging-jvm = "3.3.1"
ktor-client-serialization = "3.3.1"
ktor-serialization-gson = "3.3.1"
ktor-serialization-kotlinx-json = "3.3.1"

# Data store / Share Prefrence
datastore-preferences = "1.1.7"
appcompat = "1.7.1"

# AUTO UPDATE
app-update-ktx = "2.1.0"
foundation = "1.9.4"

coil-compose = "2.7.0"
junit = "4.12"

[libraries]
# Kotlin + Coroutines
constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayout-compose" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
#material3-icons-extended = { module = "androidx.compose.material3:material3-icons-extended" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-activity = { module = "androidx.activity:activity-compose" }
compose-navigation = { module = "androidx.navigation:navigation-compose" }
accompanist-systemuicontroller = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanist-systemuicontroller" }

# ktor http client
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor-client-android" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor-client-cio" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor-client-content-negotiation" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor-client-core" }
ktor-client-gson = { module = "io.ktor:ktor-client-gson", version.ref = "ktor-client-gson" }
ktor-client-json = { module = "io.ktor:ktor-client-json", version.ref = "ktor-client-json" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor-client-logging" }
ktor-client-logging-jvm = { module = "io.ktor:ktor-client-logging-jvm", version.ref = "ktor-client-logging-jvm" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor-client-serialization" }
ktor-serialization-gson = { module = "io.ktor:ktor-serialization-gson", version.ref = "ktor-serialization-gson" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor-serialization-kotlinx-json" }

# Data store / Share Prefrence
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }

# Lifecycle
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Room

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version = "1.3.0" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# AUTO UPDATE
app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "app-update-ktx" }
foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }


coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-compose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

